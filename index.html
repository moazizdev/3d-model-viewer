
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kitchen Design Viewer</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #20242b;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 10px;
}

button {
  padding: 12px 25px;
  border: 0;
  border-radius: 8px;
  background: #444b57;
  color: white;
  font-size: 15px;
}

button.active {
  background: #1677ff;
}

.viewer {
  width: 100%;
  height: calc(100dvh - 115px);
  display: none;
}

.viewer.active {
  display: block;
}

#modelViewer {
  width: 100%;
  height: 100%;
}

#imageViewer {
  overflow: auto;
  text-align: center;
  padding: 10px;
}

#imageViewer img {
  max-width: 100%;
  height: auto;
  object-fit: contain;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<header>Kitchen Design</header>

<div class="tabs">
  <button class="active" onclick="showTab('modelViewer', this)">
    3D Model
  </button>

  <button onclick="showTab('imageViewer', this)">
    2D Image
  </button>
</div>

<div id="modelViewer" class="viewer active"></div>

<div id="imageViewer" class="viewer">
  <img src="./kitchen.png" alt="Kitchen 2D Design">
</div>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20242b);

const camera = new THREE.PerspectiveCamera(
  45, 1, 0.1, 10000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const container = document.getElementById('modelViewer');
container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 10, 7);
scene.add(light);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

new OBJLoader().load('./kitchen.obj', (object) => {
  const box = new THREE.Box3().setFromObject(object);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  object.position.sub(center);
  scene.add(object);

  const maxDim = Math.max(size.x, size.y, size.z);

  camera.position.set(maxDim * 1.5, maxDim, maxDim * 1.8);
  camera.near = maxDim / 1000;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();

  controls.target.set(0, 0, 0);
  controls.update();
});

function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

new ResizeObserver(resize).observe(container);
resize();

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>

<script>
function showTab(id, button) {
  document.querySelectorAll('.viewer').forEach(el =>
    el.classList.remove('active')
  );

  document.querySelectorAll('.tabs button').forEach(el =>
    el.classList.remove('active')
  );

  document.getElementById(id).classList.add('active');
  button.classList.add('active');

  window.dispatchEvent(new Event('resize'));
}
</script>

</body>
</html>
