
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kitchen Design Viewer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #20242b;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
}

.layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px;
  height: calc(100dvh - 55px);
}

.panel {
  min-width: 0;
  min-height: 0;
  border: 1px solid #444b57;
  border-radius: 10px;
  overflow: hidden;
  background: #171a20;
  display: flex;
  flex-direction: column;
}

.panel h3 {
  margin: 0;
  padding: 12px;
  background: #303640;
  font-size: 15px;
}

#modelViewer {
  flex: 1;
  min-height: 0;
  position: relative;
}

#modelViewer canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.imageContainer {
  flex: 1;
  min-height: 0;
  overflow: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px;
}

.imageContainer img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

@media (max-width: 650px) {
  .layout {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 1fr;
    height: auto;
    min-height: calc(100dvh - 55px);
  }

  .panel {
    min-height: 400px;
  }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<header>Kitchen Design</header>

<main class="layout">

  <section class="panel">
    <h3>3D Model</h3>
    <div id="modelViewer"></div>
  </section>

  <section class="panel">
    <h3>2D Design</h3>
    <div class="imageContainer">
      <img src="./kitchen.png" alt="Kitchen 2D Design">
    </div>
  </section>

</main>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('modelViewer');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20242b);

const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100000);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2));

const light = new THREE.DirectionalLight(0xffffff, 2.5);
light.position.set(5, 10, 8);
scene.add(light);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.screenSpacePanning = true;

function resize() {
  const width = container.clientWidth;
  const height = container.clientHeight;

  if (!width || !height) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
}

const observer = new ResizeObserver(resize);
observer.observe(container);

new OBJLoader().load(
  './kitchen.obj',

  (object) => {
    const box = new THREE.Box3().setFromObject(object);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    object.position.sub(center);
    scene.add(object);

    const maxDim = Math.max(size.x, size.y, size.z);

    // Fit model to camera
    const fov = THREE.MathUtils.degToRad(camera.fov);
    const distance = (maxDim / 2) / Math.tan(fov / 2) * 1.35;

    camera.position.set(
      distance * 0.8,
      distance * 0.6,
      distance
    );

    camera.near = Math.max(maxDim / 10000, 0.001);
    camera.far = maxDim * 100;
    camera.updateProjectionMatrix();

    controls.target.set(0, 0, 0);
    controls.minDistance = maxDim * 0.15;
    controls.maxDistance = maxDim * 10;
    controls.update();

    resize();
  },

  undefined,

  (error) => {
    console.error('OBJ loading error:', error);
  }
);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
